<!doctype html>
<!--
  Source of the homepage video. 1280x720, 8 s seamless loop.
  Every animation shares the 8 s duration so the renderer can seek them all
  with one clock:  npm run render:video
  1 s = 12.5% of each keyframe track.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f4f7fc; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; color: #0b1f3a; }
  .stage { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  .a { animation-duration: 8s; animation-iteration-count: infinite; animation-timing-function: linear; }

  /* ---------- background ---------- */
  .glow { position: absolute; border-radius: 50%; filter: blur(80px); }
  .g1 { width: 620px; height: 620px; left: -160px; top: -220px; background: #bcd3ff; opacity: .7; animation-name: g1; }
  .g2 { width: 560px; height: 560px; right: -120px; top: 120px; background: #bfeaff; opacity: .7; animation-name: g2; }
  .g3 { width: 420px; height: 420px; left: 420px; bottom: -260px; background: #dbe6ff; opacity: .6; animation-name: g3; }
  @keyframes g1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(120px,60px) } }
  @keyframes g2 { 0%,100% { transform: translate(0,0) scale(1) } 50% { transform: translate(-80px,-40px) scale(1.15) } }
  @keyframes g3 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-100px,-30px) } }

  .floor {
    position: absolute; left: -400px; right: -400px; bottom: -120px; height: 420px;
    background-image:
      linear-gradient(rgba(29,78,216,.12) 1.5px, transparent 1.5px),
      linear-gradient(90deg, rgba(29,78,216,.09) 1.5px, transparent 1.5px);
    background-size: 80px 80px;
    transform: perspective(500px) rotateX(62deg);
    transform-origin: 50% 0;
    mask-image: linear-gradient(transparent, #000 40%, transparent 95%);
    animation-name: floor;
  }
  @keyframes floor { from { background-position: 0 0 } to { background-position: 0 160px } }

  .dust { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #1d4ed8; opacity: .0; animation-name: dust; }
  @keyframes dust { 0% { opacity: 0; transform: translateY(0) } 20% { opacity: .7 } 100% { opacity: 0; transform: translateY(-260px) } }

  /* ---------- copy ---------- */
  .copy { position: absolute; left: 88px; top: 190px; width: 520px; }
  .kicker {
    display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 999px;
    font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #1d4ed8;
    background: #fff; border: 1px solid rgba(29,78,216,.25);
  }
  .kicker i { width: 8px; height: 8px; border-radius: 50%; background: #1d4ed8; box-shadow: 0 0 10px #1d4ed8; animation: none; }
  .lines { position: relative; height: 230px; margin-top: 26px; }
  .line { position: absolute; inset: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 64px; line-height: 1.04; letter-spacing: -.03em; opacity: 0; }
  .line em { font-style: normal; background: linear-gradient(110deg, #1d4ed8, #0ea5e9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .l1 { animation-name: l1; }
  .l2 { animation-name: l2; }
  .l3 { animation-name: l3; }
  @keyframes l1 {
    0% { opacity: 0; transform: translateY(40px); filter: blur(12px) }
    5%, 26% { opacity: 1; transform: none; filter: blur(0) }
    31%, 100% { opacity: 0; transform: translateY(-40px); filter: blur(12px) }
  }
  @keyframes l2 {
    0%, 31% { opacity: 0; transform: translateY(40px); filter: blur(12px) }
    36%, 63% { opacity: 1; transform: none; filter: blur(0) }
    68%, 100% { opacity: 0; transform: translateY(-40px); filter: blur(12px) }
  }
  @keyframes l3 {
    0%, 68% { opacity: 0; transform: translateY(40px); filter: blur(12px) }
    73%, 95% { opacity: 1; transform: none; filter: blur(0) }
    100% { opacity: 0; transform: translateY(-40px); filter: blur(12px) }
  }

  .devices { position: absolute; left: 88px; top: 466px; font-size: 17px; font-weight: 500; color: #a7bcb3; letter-spacing: .01em; }

  /* ---------- route (pickup -> repair -> delivered) ---------- */
  .route { position: absolute; left: 88px; top: 520px; width: 470px; height: 70px; }
  .track { position: absolute; left: 22px; right: 22px; top: 21px; height: 4px; border-radius: 4px; background: rgba(11,31,58,.1); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(90deg, #1d4ed8, #0ea5e9); box-shadow: 0 0 12px rgba(29,78,216,.5); animation-name: fill; }
  @keyframes fill { 0% { width: 0 } 90% { width: 100% } 100% { width: 100% } }
  .rider {
    position: absolute; top: -13px; width: 30px; height: 30px; border-radius: 50%;
    background: #fff; display: grid; place-items: center; box-shadow: 0 0 18px rgba(29,78,216,.55);
    animation-name: rider;
  }
  .rider svg { width: 18px; height: 18px; }
  @keyframes rider { 0% { left: -15px } 90% { left: calc(100% - 15px) } 100% { left: calc(100% - 15px); opacity: 0 } }
  .node { position: absolute; top: 0; width: 46px; text-align: center; }
  .node b { display: block; width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(11,31,58,.14); background: #fff; display: grid; place-items: center; }
  .node b { stroke: #8593a8; }
  .node b svg { width: 20px; height: 20px; }
  .node span { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 14px; font-weight: 600; color: #6d7090; }
  .node span { box-shadow: none !important; border: 0 !important; }
  .n1 { left: 0 } .n2 { left: calc(50% - 23px) } .n3 { right: 0 }
  .n1 b, .n1 span { animation: n1 8s linear infinite; }
  .n2 b, .n2 span { animation: n2 8s linear infinite; }
  .n3 b, .n3 span { animation: n3 8s linear infinite; }
  @keyframes n1 { 0%, 2% { border-color: rgba(255,255,255,.18); color: #6d7090; stroke: #6d7090 } 5%, 95% { border-color: #1d4ed8; color: #0b1f3a; stroke: #1d4ed8; box-shadow: 0 0 16px rgba(29,78,216,.35) } 100% { border-color: rgba(255,255,255,.18); color: #6d7090 } }
  @keyframes n2 { 0%, 44% { border-color: rgba(255,255,255,.18); color: #6d7090; stroke: #6d7090 } 47%, 95% { border-color: #1d4ed8; color: #0b1f3a; stroke: #1d4ed8; box-shadow: 0 0 16px rgba(29,78,216,.35) } 100% { border-color: rgba(255,255,255,.18); color: #6d7090 } }
  @keyframes n3 { 0%, 87% { border-color: rgba(255,255,255,.18); color: #6d7090; stroke: #6d7090 } 90%, 97% { border-color: #0ea5e9; color: #0b1f3a; stroke: #0ea5e9; box-shadow: 0 0 18px rgba(18,161,80,.45) } 100% { border-color: rgba(255,255,255,.18); color: #6d7090 } }

  /* ---------- phone ---------- */
  .scene3d { position: absolute; left: 700px; top: 60px; width: 480px; height: 600px; perspective: 1100px; }
  .halo { position: absolute; left: 50%; top: 50%; width: 460px; height: 460px; margin: -230px 0 0 -230px; border-radius: 50%;
    background: conic-gradient(from 0deg, #1d4ed8, #0ea5e9, #6ea8ff, #1d4ed8); filter: blur(70px); opacity: .28; animation-name: spin; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .ring { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 1.5px solid rgba(29,78,216,.25); transform: translate(-50%,-50%) rotateX(72deg); }
  .r1 { width: 520px; height: 520px; animation-name: ring; }
  .r2 { width: 400px; height: 400px; border-color: rgba(14,165,233,.25); animation-name: ring2; }
  @keyframes ring { from { transform: translate(-50%,-50%) rotateX(72deg) rotateZ(0) } to { transform: translate(-50%,-50%) rotateX(72deg) rotateZ(360deg) } }
  @keyframes ring2 { from { transform: translate(-50%,-50%) rotateX(72deg) rotateZ(360deg) } to { transform: translate(-50%,-50%) rotateX(72deg) rotateZ(0) } }
  .ring::after { content: ''; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; border-radius: 50%; background: #1d4ed8; box-shadow: 0 0 12px #1d4ed8; }

  .phone-wrap { position: absolute; left: 50%; top: 50%; width: 250px; height: 510px; margin: -255px 0 0 -125px; transform-style: preserve-3d; animation-name: sway; animation-timing-function: ease-in-out; }
  @keyframes sway {
    0%, 100% { transform: rotateY(-22deg) rotateX(8deg) translateY(0) }
    50% { transform: rotateY(16deg) rotateX(4deg) translateY(-14px) }
  }
  .phone {
    position: absolute; inset: 0; border-radius: 42px; padding: 11px;
    background: linear-gradient(145deg, #3a3a52, #16161f 40%, #2a2a3c);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18), 0 40px 70px -26px rgba(11,31,58,.5), 0 0 40px -14px rgba(29,78,216,.35);
  }
  .btn-side { position: absolute; right: -4px; width: 4px; border-radius: 0 3px 3px 0; background: #2a2a3c; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 32px; overflow: hidden; background: #0a0a12; }
  .island { position: absolute; top: 12px; left: 50%; width: 86px; height: 24px; margin-left: -43px; border-radius: 20px; background: #000; z-index: 6; }

  /* broken state */
  .broken { position: absolute; inset: 0; background: radial-gradient(circle at 62% 38%, #1c1c2a, #07070c 70%); animation-name: broken; }
  @keyframes broken { 0%, 22% { opacity: 1 } 38%, 90% { opacity: 0 } 100% { opacity: 1 } }
  .crack { position: absolute; inset: 0; width: 100%; height: 100%; }
  .crack path { fill: none; stroke: rgba(230,235,255,.85); stroke-width: 1.4; stroke-linecap: round; }
  .glitch { position: absolute; left: 0; right: 0; height: 18px; background: rgba(244,114,182,.35); mix-blend-mode: screen; animation-name: glitch; opacity: 0; }
  @keyframes glitch { 0%,3% { opacity: 0; top: 30% } 4% { opacity: 1; top: 30% } 5% { opacity: 0; top: 64% } 9% { opacity: 1; top: 64% } 10%, 14% { opacity: 0 } 15% { opacity: 1; top: 18% } 16%,100% { opacity: 0 } }

  /* scan */
  .scan { position: absolute; left: -10%; right: -10%; height: 3px; background: #cfe0ff; box-shadow: 0 0 18px 6px rgba(29,78,216,.7), 0 0 60px 20px rgba(14,165,233,.3); opacity: 0; animation-name: scan; z-index: 5; }
  @keyframes scan { 0%, 19% { top: -2%; opacity: 0 } 20% { opacity: 1 } 39% { top: 102%; opacity: 1 } 40%, 100% { top: 102%; opacity: 0 } }
  .scanfield { position: absolute; left: 0; right: 0; top: 0; background: linear-gradient(to bottom, rgba(29,78,216,.0), rgba(29,78,216,.2)); animation-name: scanfield; opacity: 0; z-index: 4; }
  @keyframes scanfield { 0%, 19% { height: 0; opacity: 0 } 20% { opacity: 1 } 39% { height: 100%; opacity: 1 } 44%, 100% { height: 100%; opacity: 0 } }

  /* fixed state */
  .fixed { position: absolute; inset: 0; opacity: 0; color: #fff; animation-name: fixed; background:
      radial-gradient(circle at 20% 15%, #3b82f6 0, transparent 55%),
      radial-gradient(circle at 85% 60%, #0ea5e9 0, transparent 50%),
      radial-gradient(circle at 30% 95%, #1d4ed8 0, transparent 45%), #0b1f3a; }
  @keyframes fixed { 0%, 36% { opacity: 0; filter: brightness(2.2) } 44% { opacity: 1; filter: brightness(1) } 90% { opacity: 1 } 97%, 100% { opacity: 0 } }
  .status { position: absolute; top: 14px; left: 22px; right: 22px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; z-index: 7; }
  .clock { position: absolute; top: 70px; width: 100%; text-align: center; font-family: 'Plus Jakarta Sans'; font-weight: 600; font-size: 64px; letter-spacing: -.02em; }
  .date { position: absolute; top: 146px; width: 100%; text-align: center; font-size: 14px; opacity: .8; }
  .check { position: absolute; left: 50%; top: 230px; width: 96px; height: 96px; margin-left: -48px; border-radius: 50%; background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.35); display: grid; place-items: center; backdrop-filter: blur(10px); animation-name: pop; }
  @keyframes pop { 0%, 42% { transform: scale(.3); opacity: 0 } 48% { transform: scale(1.12); opacity: 1 } 52%, 90% { transform: scale(1); opacity: 1 } 100% { transform: scale(1); opacity: 0 } }
  .check svg { width: 50px; height: 50px; }
  .check path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw 8s linear infinite; }
  @keyframes draw { 0%, 46% { stroke-dashoffset: 60 } 54%, 100% { stroke-dashoffset: 0 } }
  .toast { position: absolute; left: 16px; right: 16px; bottom: 26px; padding: 14px 16px; border-radius: 20px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); backdrop-filter: blur(14px); animation-name: toast; }
  .toast b { display: block; font-size: 14px; }
  .toast span { font-size: 12px; opacity: .8; }
  @keyframes toast { 0%, 52% { transform: translateY(120px); opacity: 0 } 58%, 90% { transform: none; opacity: 1 } 96%, 100% { transform: translateY(120px); opacity: 0 } }

  /* floating tags */
  .tag { position: absolute; padding: 10px 16px; border-radius: 16px; background: #fff; border: 1px solid rgba(11,31,58,.1); backdrop-filter: blur(12px); font-size: 15px; font-weight: 600; white-space: nowrap; box-shadow: 0 16px 32px -14px rgba(11,31,58,.3); display: flex; align-items: center; gap: 10px; }
  .tag i { width: 10px; height: 10px; border-radius: 50%; }
  .t1 { left: -40px; top: 120px; animation-name: bob1; }
  .t2 { right: -30px; top: 70px; animation-name: bob2; }
  .t3 { right: -60px; top: 330px; animation-name: bob1; animation-delay: -2s; }
  .t4 { left: -70px; top: 400px; animation-name: bob2; animation-delay: -3s; }
  @keyframes bob1 { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-16px) } }
  @keyframes bob2 { 0%, 100% { transform: translateY(-10px) } 50% { transform: translateY(8px) } }

  .price { position: absolute; right: -20px; top: 470px; padding: 14px 20px; border-radius: 18px; background: #1d4ed8; color: #fff; font-family: 'Plus Jakarta Sans'; font-weight: 700; font-size: 22px; animation-name: price; box-shadow: 0 20px 40px -12px rgba(29,78,216,.45); }
  .price small { display: block; font-family: 'Plus Jakarta Sans'; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
  @keyframes price { 0%, 50% { transform: scale(0) rotate(-12deg); opacity: 0 } 56% { transform: scale(1.1) rotate(3deg); opacity: 1 } 60%, 92% { transform: scale(1) rotate(0); opacity: 1 } 98%, 100% { transform: scale(0); opacity: 0 } }

  .flash { position: absolute; inset: 0; background: radial-gradient(circle at 73% 50%, rgba(14,165,233,.35), transparent 50%); opacity: 0; animation-name: flash; pointer-events: none; }
  @keyframes flash { 0%, 38% { opacity: 0 } 41% { opacity: 1 } 50%, 100% { opacity: 0 } }

  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 60%, rgba(255,255,255,.45)); pointer-events: none; }
</style>
</head>
<body>
<div class="stage">
  <div class="glow g1 a"></div>
  <div class="glow g2 a"></div>
  <div class="glow g3 a"></div>
  <div class="floor a"></div>
  <div id="dust"></div>

  <div class="copy">
    <span class="kicker"><i></i>Doorstep electronics repair</span>
    <div class="lines">
      <div class="line l1 a">Phone. Laptop.<br /><em>Printer. CCTV.</em></div>
      <div class="line l2 a">We fix it<br /><em>at your door.</em></div>
      <div class="line l3 a">Picked up.<br />Repaired.<br /><em>Delivered.</em></div>
    </div>
  </div>

  <div class="route">
    <div class="track"><div class="fill a"></div><div class="rider a"><svg viewBox="0 0 24 24" fill="none" stroke="#07070d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17h5l3-7h4M14 10l-2-3H9"/></svg></div></div>
    <div class="node n1"><b><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></b><span>Pickup</span></div>
    <div class="node n2"><b><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/></svg></b><span>Repair</span></div>
    <div class="node n3"><b><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></b><span>Delivered</span></div>
  </div>

  <div class="scene3d">
    <div class="halo a"></div>
    <div class="ring r1 a"></div>
    <div class="ring r2 a"></div>

    <div class="phone-wrap a">
      <div class="phone">
        <span class="btn-side" style="top:120px;height:70px"></span>
        <span class="btn-side" style="left:-4px;right:auto;top:100px;height:40px;border-radius:3px 0 0 3px"></span>
        <div class="screen">
          <div class="island"></div>

          <div class="broken a">
            <svg class="crack" viewBox="0 0 228 488" preserveAspectRatio="none">
              <path d="M150 170 L118 120 L104 40 L96 0" />
              <path d="M150 170 L200 150 L228 128" />
              <path d="M150 170 L190 230 L210 300 L228 330" />
              <path d="M150 170 L120 240 L80 280 L40 360 L0 400" />
              <path d="M150 170 L90 190 L30 180 L0 200" />
              <path d="M150 170 L160 260 L150 350 L170 488" />
              <path d="M118 120 L70 110 L20 70" />
              <path d="M120 240 L130 320 L100 400" />
              <path d="M190 230 L228 240" />
              <path d="M80 280 L40 250" />
              <path d="M160 260 L200 300" />
              <circle cx="150" cy="170" r="10" fill="rgba(255,255,255,.12)" stroke="rgba(230,235,255,.9)" />
            </svg>
            <div class="glitch a"></div>
          </div>

          <div class="scanfield a"></div>
          <div class="scan a"></div>

          <div class="fixed a">
            <div class="status"><span>9:41</span><span>100%</span></div>
            <div class="clock">9:41</div>
            <div class="date">Repair complete</div>
            <div class="check a"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></div>
            <div class="toast a"><b>Your device is on its way back</b><span>Rider arriving in 25 min</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tag t1 a"><i style="background:#1d4ed8;box-shadow:0 0 6px #1d4ed8"></i>Laptops</div>
    <div class="tag t2 a"><i style="background:#1d4ed8;box-shadow:0 0 6px #1d4ed8"></i>Printers</div>
    <div class="tag t3 a"><i style="background:#1d4ed8;box-shadow:0 0 6px #1d4ed8"></i>CCTV install</div>
    <div class="tag t4 a"><i style="background:#1d4ed8;box-shadow:0 0 6px #1d4ed8"></i>Phones</div>
    <div class="price a"><small>Estimate</small>OMR 0</div>
  </div>

  <div class="flash a"></div>
  <div class="vignette"></div>
</div>
<script>
  // Deterministic dust: positions from a fixed seed so every render matches.
  let s = 7;
  const r = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const box = document.getElementById('dust');
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('span');
    d.className = 'dust a';
    d.style.left = (r() * 1280) + 'px';
    d.style.top = (300 + r() * 420) + 'px';
    d.style.animationDelay = (-r() * 8) + 's';
    const size = 1.5 + r() * 2.5;
    d.style.width = d.style.height = size + 'px';
    box.appendChild(d);
  }
</script>
</body>
</html>
